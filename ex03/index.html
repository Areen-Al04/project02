<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colors & Opacity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Color formats</h2>
  <div class="swatches">
    <div class="swatch named">Named</div>
    <div class="swatch hex">HEX</div>
    <div class="swatch rgb">RGB</div>
    <div class="swatch rgba">RGBA</div>
  </div>

  <h2>opacity vs rgba</h2>
  <div class="stage">
    <div class="box box-opacity">
      <p>opacity: 0.5</p>
    </div>
    <div class="box box-rgba">
      <p>rgba(..., 0.5)</p>
    </div>
  </div>

</body>
</html>
